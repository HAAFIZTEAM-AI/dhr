server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls so the browser only ever talks to one origin. This removes
    # the need for CORS entirely in the containerized deployment and means the
    # frontend bundle carries no hardcoded backend URL.
    location /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: react-router owns client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # PWA service worker must never be cached, or users cannot receive updates.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
